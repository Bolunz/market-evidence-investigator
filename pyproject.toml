[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-evidence-investigator"
version = "0.1.0"
description = "Evidence-first agentic investigation of consumer needs, market responses and sell-out outcomes."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "langchain-core>=1.8,<2",
  "langchain-anthropic>=1.7,<2",
  "pydantic>=2.10,<3",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=2.0",
  "scipy>=1.13",
  "jinja2>=3.1",
  "matplotlib>=3.9",
  "rich>=13",
  "python-dotenv>=1.0",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mei = "mei.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
